[project]
name = "multi-agent-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Aadi", email = "aadiskrish@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "docx2txt>=0.9",
    "duckduckgo-search>=8.1.1",
    "fastapi>=0.165.0",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-openai>=1.8.5",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.24",
    "langsmith>=0.15.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "pytest>=9.2.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.4",
    "rank-bm25>=0.2.2",
    "requests>=2.34.2",
    "sentence-transformers>=6.3.0",
    "sqlalchemy>=2.1.9",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
multi-agent-rag = "multi_agent_rag:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
